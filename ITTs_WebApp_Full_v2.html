function rows(c){return DL[c]||[]}
function find(c,f,v){var a=rows(c);for(var i=0;i<a.length;i++)if(a[i][f]===v)return a[i];return null}
function where(c,fn){return rows(c).filter(fn)}
function ecode(v){if(v==null)return"";var m=String(v).match(/^([^(]+?)\s*\(/);return m?m[1].trim():String(v).trim()}
function elabel(v){if(v==null||v==="")return"";var m=String(v).match(/\(([^)]+)\)\s*$/);return m?m[1]:String(v)}
function num(v){if(v==null||v==="")return 0;var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n}
function money(v){var n=num(v);return n?n.toLocaleString("vi-VN"):"-"}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function naCls(s){s=String(s||"");if(/ ngay| gấp|GỌI|NGUY|GẤP/.test(s))return"red";if(/Không cần làm gì/.test(s))return"green";return s?"amber":"gray"}
function stCls(v){var c=ecode(v);
 if(/at_risk|off_track|rejected|unreachable|no_response|high|open|overdue|late|absent|cancelled|failed|not_/.test(c))return"red";
 if(/on_track|completed|confirmed|resolved|converted|present|paid|done|graded|passed|active|success|achieved/.test(c))return"green";
 if(/pending|considering|new|processing|partial|medium|scheduled|booked|in_progress|assigned|submitted/.test(c))return"amber";
 return"gray"}

 rows("DL02").forEach(function(r){if((r.full_name||"").toLowerCase().indexOf(q)>=0||String(r.phone_number||"").indexOf(q)>=0)res.push({t:"Lead",id:r.lead_id,nm:r.full_name,sub:elabel(r.lead_status)+" - "+r.phone_number,na:r.next_action})});
 h+='<div class="panel"><div class="pbody">';
 if(!res.length)h+='<div class="empty">Không thấy kết quả.</div>';
 res.forEach(function(r){var cl=naCls(r.na);h+='<div class="task '+cl+'"><div class="ti"><div class="id">'+esc(r.t)+' - '+esc(r.id)+'</div><div class="nm">'+esc(r.nm)+'</div><div class="mt">'+esc(r.sub)+'</div>'+(r.na?'<div class="na">'+esc(r.na)+'</div>':'')+'</div><div class="ac">'+(r.sid?'<button class="btn sm" onclick="openHoso(\''+r.sid+'\')"><i class="ti ti-id-badge-2"></i>Hồ sơ 360</button>':'<button class="btn sm"><i class="ti ti-external-link"></i>Mở</button>')+'</div></div>'});
 h+='</div></div>';return h}
function openHoso(sid){window.HOSO=sid;go("hoso")}

function renderHoso(){
 var s=rows("DL09"),sid=window.HOSO||(s[0]&&s[0].student_id),r=find("DL09","student_id",sid)||{};
 var h='<div class="phead"><div><div class="t">Hồ sơ 360 - '+esc(r.full_name||sid)+'</div><div class="s">'+esc(sid)+' - gom dữ liệu từ mọi sheet quanh mã học viên</div></div>'+
 '<div class="sp"><select class="sel" onchange="window.HOSO=this.value;reRender(\'hoso\')">';
 s.forEach(function(x){h+='<option value="'+x.student_id+'"'+(x.student_id===sid?" selected":"")+'>'+esc(x.student_id)+' - '+esc(x.full_name)+'</option>'});
 h+='</select></div></div>';
 var enr=rows("DL06").filter(function(x){return x.student_id===sid});
 var pay=rows("DL07").filter(function(x){return x.student_id===sid});
 var att=rows("DL12").filter(function(x){return x.student_id===sid});
 var hw=rows("DL13").filter(function(x){return x.student_id===sid});
 var ww=rows("DL14").filter(function(x){return x.student_id===sid});
 var fb=rows("DL16").filter(function(x){return x.student_id===sid});
 var kn=rows("DL17").filter(function(x){return x.student_id===sid});
 var ob=rows("DL08").filter(function(x){return x.student_id===sid});
 var ce=rows("DL18").filter(function(x){return x.student_id===sid});
 var paid=pay.reduce(function(a,b){return a+num(b.amount)},0);
 var present=att.filter(function(a){return/present|on_time|late/.test(ecode(a.attendance_status))}).length;
 function kv(k,v){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+(v==null||v===""?"-":esc(v))+'</span></div>'}
 function card(icon,title,body){return '<div class="bcard"><h4><i class="ti '+icon+'"></i>'+title+'</h4>'+body+'</div>'}
 h+='<div class="bcards">';
 h+=card("ti-user","Khối 1 - Thông tin",kv("SĐT",r.phone_number)+kv("Đối tượng",elabel(r.student_type))+kv("Trạng thái",elabel(r.student_status))+kv("Chuyên cần",'<span class="chip '+stCls(r.attendance_progress_status)+'">'+elabel(r.attendance_progress_status)+'</span>')+kv("Học thuật",'<span class="chip '+stCls(r.academic_progress_status)+'">'+elabel(r.academic_progress_status)+'</span>'));
 h+=card("ti-credit-card","Khối 2 - Khóa & công nợ",kv("Số đăng ký",enr.length)+enr.map(function(e){return kv(elabel(e.course_id_name||e.course_id),money(e.final_fee)+"đ")}).join("")+kv("Đã đóng",money(paid)+"đ")+kv("Còn lại",money(enr.reduce(function(a,b){return a+num(b.remaining_amount)},0))+"đ"));
 h+=card("ti-checkbox","Khối 3 - Lớp & chuyên cần",kv("Xếp lớp",ob.length?elabel(ob[0].class_id_name||ob[0].class_id):"-")+kv("Onboarding",ob.length?elabel(ob[0].onboarding_status):"-")+kv("Buổi có mặt",present+"/"+att.length));
 h+=card("ti-book","Khối 4 - Học thuật",kv("Số bài tập",hw.length)+kv("Đã chấm",hw.filter(function(x){return/graded/.test(ecode(x.homework_status))}).length)+hw.slice(0,3).map(function(x){return kv(x.homework_title,x.homework_score||"-")}).join(""));
 h+=card("ti-star","Khối 5 - WOW 1-1",kv("Quota còn",r.wow_quota_remaining)+kv("Đã dùng",r.wow_quota_used)+kv("Số buổi",ww.length)+ww.slice(0,3).map(function(x){return kv(x.wow_session_date,elabel(x.wow_status))}).join(""));
 h+=card("ti-message-2","Khối 6 - Phản hồi & Khiếu nại",kv("Phản hồi",fb.length)+kv("Khiếu nại",kn.length)+kn.map(function(x){return kv(elabel(x.complaint_type),'<span class="chip '+stCls(x.complaint_status)+'">'+elabel(x.complaint_status)+'</span>')}).join(""));
 h+=card("ti-flag","Khối 7 - Kết thúc & Tái ĐK",ce.length?(kv("Điểm cuối",ce[0].final_test_score)+kv("Chuyên cần",ce[0].attendance_rate)+kv("Đạt mục tiêu",elabel(ce[0].achievement_status))+kv("Tái ĐK",elabel(ce[0].re_enrollment_status))):kv("Trạng thái","Chưa kết thúc khóa"));
 h+=card("ti-note","Khối 8-9 - Ghi chú",kv("Ngày gia nhập",r.joined_at)+kv("Cơ sở",r.branch)+kv("Ghi chú",r.notes||r.learning_followup_note||"-"));
 h+='</div>';return h}

function renderBanglop(){
 var cls=rows("DL10"),cid=window.BLCLASS||(cls[0]&&cls[0].class_id),lop=find("DL10","class_id",cid)||{};
 var h='<div class="phead"><div><div class="t">Bảng lớp - '+esc(lop.class_name||cid)+'</div><div class="s">Danh sách học viên, chuyên cần, bài tập của lớp</div></div>'+
 '<div class="sp"><select class="sel" onchange="window.BLCLASS=this.value;reRender(\'banglop\')">';
 cls.forEach(function(c){h+='<option value="'+c.class_id+'"'+(c.class_id===cid?" selected":"")+'>'+esc(c.class_id)+' - '+esc(c.class_name)+'</option>'});
 h+='</select><button class="btn primary" onclick="go(\'diemdanh\')"><i class="ti ti-checkbox"></i>Điểm danh</button></div></div>';
 h+='<div class="bcards" style="margin-bottom:14px">';
 function kv(k,v){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+(v==null||v===""?"-":esc(v))+'</span></div>'}
 h+='<div class="bcard"><h4><i class="ti ti-info-circle"></i>Thông tin lớp</h4>'+kv("Khóa",elabel(lop.course_id_name||lop.course_id))+kv("Giáo viên",lop.main_teacher_id)+kv("Lịch",lop.class_schedule)+kv("Khai giảng",lop.class_start_date)+kv("Sĩ số",(lop.current_enrollment||"-")+"/"+(lop.class_capacity||"-"))+kv("Trạng thái",elabel(lop.class_status))+'</div>';
 var enr=rows("DL08").filter(function(r){return r.class_id===cid});
 h+='</div><div class="panel"><div class="ph"><b>Học viên trong lớp ('+enr.length+')</b></div><div class="tbwrap"><table class="dt"><thead><tr><th>Mã HV</th><th>Họ tên</th><th>Chuyên cần</th><th>Bài tập</th><th>Trạng thái</th></tr></thead><tbody>';
 if(!enr.length)h+='<tr><td class="empty" colspan="5">Lớp chưa có học viên.</td></tr>';
 enr.forEach(function(e){var s=find("DL09","student_id",e.student_id)||{};
  var att=rows("DL12").filter(function(x){return x.student_id===e.student_id});
  var pr=att.filter(function(x){return/present|on_time|late/.test(ecode(x.attendance_status))}).length;
  var rate=att.length?Math.round(pr/att.length*100)+"%":"-";
  var hw=rows("DL13").filter(function(x){return x.student_id===e.student_id});
  var gr=hw.filter(function(x){return/graded/.test(ecode(x.homework_status))}).length;
  var risk=/at_risk|off_track/.test(ecode(s.attendance_progress_status)+" "+ecode(s.academic_progress_status));
  h+='<tr><td>'+esc(e.student_id)+'</td><td>'+esc(s.full_name||"-")+'</td><td>'+rate+'</td><td>'+gr+'/'+hw.length+'</td><td><span class="chip '+(risk?"red":"green")+'">'+(risk?"Nguy cơ":"Ổn định")+'</span></td></tr>'});
 h+='</tbody></table></div></div>';return h}

function renderBaocao(){
 var L=rows("DL02"),S=rows("DL09"),E=rows("DL06");
 var funnel=[["Lead",L.length],["Đặt test",rows("DL03").length],["Tư vấn",rows("DL04").length],["Đăng ký",E.length],["Đang học",S.filter(function(r){return/active|studying/.test(ecode(r.student_status))}).length]];
 var mx=Math.max.apply(null,funnel.map(function(f){return f[1]}))||1;
 var kpis=[["Tỷ lệ chuyển đổi (CVR)",Math.round(L.filter(function(r){return/converted/.test(ecode(r.lead_status))}).length/L.length*100)+"%","40%","green"],
  ["Học viên nguy cơ",S.filter(function(r){return/at_risk|off_track/.test(ecode(r.attendance_progress_status)+" "+ecode(r.academic_progress_status))}).length+" HV","< 4","amber"],
  ["Công nợ tồn",money(E.reduce(function(a,b){return a+num(b.remaining_amount)},0))+"đ","-","amber"],
  ["Khiếu nại đang mở",rows("DL17").filter(function(r){return!/resolved/.test(ecode(r.complaint_status))}).length,"0","red"],
  ["Chiết khấu chờ duyệt",E.filter(function(r){return num(r.discount_amount)>=1000000&&!r.discount_approved_by}).length,"-","amber"],
  ["Số lớp vận hành",rows("DL10").length,"-","blue"]];
 var h='<div class="phead"><div><div class="t">Báo cáo & KPI</div><div class="s">Tổng hợp từ dữ liệu vận hành - ngưỡng KPI lấy từ CH6</div></div></div>';
 h+='<div class="grid2"><div class="panel"><div class="ph"><b>Chỉ số chính</b></div><div class="tbwrap"><table class="dt"><thead><tr><th>KPI</th><th>Giá trị</th><th>Ngưỡng</th><th>Trạng thái</th></tr></thead><tbody>';
 kpis.forEach(function(k){h+='<tr><td>'+k[0]+'</td><td style="font-weight:700">'+k[1]+'</td><td>'+k[2]+'</td><td><span class="chip '+k[3]+'">'+(k[3]==="green"?"Đạt":k[3]==="red"?"Cần xử lý":"Theo dõi")+'</span></td></tr>'});
 h+='</tbody></table></div></div>';
 h+='<div class="panel"><div class="ph"><b>Phễu khách hàng</b></div><div style="padding:14px 16px">';
 funnel.forEach(function(f){h+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600"><span>'+f[0]+'</span><span>'+f[1]+'</span></div><div class="minibar"><i style="width:'+Math.round(f[1]/mx*100)+'%"></i></div></div>'});
 h+='</div></div></div>';
 h+='<div class="panel"><div class="ph"><b>Học viên nguy cơ cần theo dõi</b></div><div class="tbwrap"><table class="dt"><thead><tr><th>Mã HV</th><th>Họ tên</th><th>Chuyên cần</th><th>Học thuật</th><th>Việc cần làm</th></tr></thead><tbody>';
 var rk=S.filter(function(r){return/at_risk|off_track/.test(ecode(r.attendance_progress_status)+" "+ecode(r.academic_progress_status))});
 if(!rk.length)h+='<tr><td class="empty" colspan="5">Không có học viên nguy cơ.</td></tr>';
 rk.forEach(function(r){h+='<tr><td>'+esc(r.student_id)+'</td><td>'+esc(r.full_name)+'</td><td><span class="chip '+stCls(r.attendance_progress_status)+'">'+elabel(r.attendance_progress_status)+'</span></td><td><span class="chip '+stCls(r.academic_progress_status)+'">'+elabel(r.academic_progress_status)+'</span></td><td>'+esc(r.next_action||"-")+'</td></tr>'});
 h+='</tbody></table></div></div>';return h}

var RENDER={dashboard:renderDashboard,viec:renderViec,duyet:renderDuyet,diemdanh:renderDiemDanh,tracuu:renderTracuu,hoso:renderHoso,banglop:renderBanglop,baocao:renderBaocao};
function dashJump(key){var m={urgent:"viec",newlead:"nhaplead",consider:"viec",convert:"tuvan",risk:"viec",onboard:"xeplop",approve:"duyet",debt:"thanhtoan",complaint:"khieunai",ungraded:"baitap",testpend:"test",wowbook:"wow",unverified:"thanhtoan",classes:"banglop"};var pg=m[key];if(pg&&RBK[CURROLE].pages.indexOf(pg)>=0)go(pg);else go("viec")}

/* ---------- router ---------- */
function reRender(k){var el=document.getElementById("content");el.innerHTML=RENDER[k]()}
function reRenderKeep(k){var el=document.getElementById("content");var sc=el.scrollTop;el.innerHTML=RENDER[k]();el.scrollTop=sc;var i=el.querySelector(".srch input");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function go(key){var p=PBK[key];if(!p)return;CUR=key;
 [].forEach.call(document.querySelectorAll(".navitem"),function(n){n.classList.toggle("on",n.getAttribute("data-k")===key)});
 document.getElementById("pgTitle").textContent=p.t;document.getElementById("pgCrumb").textContent=p.c;
 var el=document.getElementById("content");
 if(p.ty==="list")el.innerHTML=renderList(key);else el.innerHTML=RENDER[key]();
 el.scrollTop=0}
function buildNav(){var r=RBK[CURROLE],h="",lastg="";
 PAGES.forEach(function(p){if(r.pages.indexOf(p.k)<0)return;
  if(p.g!==lastg){h+='<div class="navlbl">'+esc(p.g)+'</div>';lastg=p.g}
  var badge="";if(p.k==="viec")badge='<span class="dot">'+roleTasks(CURROLE).length+'</span>';
  if(p.k==="duyet"){var n=rows("DL06").filter(function(x){return num(x.discount_amount)>=1000000&&!x.discount_approved_by}).length;if(n)badge='<span class="dot">'+n+'</span>'}
  h+='<div class="navitem" data-k="'+p.k+'" onclick="go(\''+p.k+'\')"><i class="ti '+p.ic+'"></i>'+esc(p.t)+badge+'</div>'});
 document.getElementById("nav").innerHTML=h}
function setRole(k){CURROLE=k;var r=RBK[k],st=staffFor(k);
 document.getElementById("meName").textContent=st.staff_id+" - "+st.full_name;
 document.getElementById("meRole").textContent=r.name;
 document.getElementById("meAv").textContent=(st.full_name||"?").trim().slice(-1).toUpperCase()==""?"?":(st.full_name.trim().split(" ").pop()[0]||"?");
 document.getElementById("roleSel").value=k;
 buildNav();go("dashboard")}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove("show")},1900)}
function enter(k){document.getElementById("login").style.display="none";document.getElementById("app").style.display="flex";setRole(k)}

(function(){
 var rs=document.getElementById("roleSel");ROLES.forEach(function(r){var o=document.createElement("option");o.value=r.k;o.textContent=r.name;rs.appendChild(o)});
 var g=document.getElementById("rgrid");ROLES.forEach(function(r){var d=document.createElement("div");d.className="rcard";d.onclick=function(){enter(r.k)};
  var cnt=r.pages.length;d.innerHTML='<div class="ri"><i class="ti '+r.ic+'"></i></div><b>'+r.name+'</b><small>'+cnt+' trang</small>';g.appendChild(d)});
})();
</script></body></html>
